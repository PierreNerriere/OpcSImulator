[project]
name = "opc-simulator"
version = "0.1.0"
description = "Simulateur de serveur OPC UA piloté par une liste de points en JSON (style Wago PFC100)"
requires-python = ">=3.10"
dependencies = ["asyncua>=1.1,<3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
